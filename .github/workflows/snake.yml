name: snake · regenerate contribution graph

# Regenerates the snake-eats-contributions SVG for the profile README.
# Outputs three SVGs into the `output` branch:
#   - github-contribution-grid-snake.svg          (theme-agnostic fallback)
#   - github-snake.svg                            (light, emerald snake on cream)
#   - github-snake-dark.svg                       (dark, brighter snake on cocoa)
# README embeds them via a <picture> that swaps based on the viewer's
# prefers-color-scheme so it matches whichever theme they read GitHub in.

on:
  schedule:
    # Nightly at 00:13 UTC — odd minute to avoid the top-of-hour stampede.
    - cron: "13 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Render light + dark + a default in one pass.
          # Palette mirrors the README's Atelier × Cinema design tokens:
          #   light: cream paper, ink dot, emerald snake, emerald food trail
          #   dark:  cocoa paper, cream dots, brighter emerald snake/trail
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-snake.svg?palette=github-light&color_snake=%230E5347&color_dots=%23EDE6D5,%23B7CFB1,%2378B58F,%230E5347,%230B3D33
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%235BC795&color_dots=%231F1A14,%2334573F,%23548E6A,%235BC795,%2398E3BC

      - name: push SVGs to the `output` branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
