name: studio · regenerate visual artifacts

# Generates the Workshop Ledger plate (scripts/build-ledger.mjs) and
# publishes it to the `output` branch. The ledger plate carries figures,
# a 30-day sparkline, and a full year grid in one composition. The
# previous Platane/snk contribution-snake step was removed: the snake
# rendered with low-contrast empty cells against the paper palette and
# duplicated information already on the ledger.

on:
  schedule:
    # Twice daily at 06:13 and 18:13 UTC. Stats change as Tony
    # commits, and nightly is too slow if the ledger should feel current.
    - cron: "13 6,18 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: render workshop ledger SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: node scripts/build-ledger.mjs

      - name: push artifacts to the `output` branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
