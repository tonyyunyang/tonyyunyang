<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 150" role="img" aria-label="Now in Amsterdam. Route: Shanghai, Shenzhen, Delft, Madrid, Amsterdam.">
  <title>Now in Amsterdam · the route in order</title>
  <desc>A small editorial plate showing the cities Tony has lived in, drawn as a hand-routed line. The current city is the filled accent dot at the right end.</desc>

  <defs>
    <pattern id="loc-hatch-d" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(35)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#EFE4CE" stroke-width="0.45" opacity="0.32"/>
    </pattern>
    <pattern id="loc-hatch-fine-d" patternUnits="userSpaceOnUse" width="4" height="4" patternTransform="rotate(-30)">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#EFE4CE" stroke-width="0.3" opacity="0.16"/>
    </pattern>
    <radialGradient id="loc-pin-glow-d" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5BC795" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#5BC795" stop-opacity="0"/>
    </radialGradient>
    <style><![CDATA[
      @keyframes locPulseD { 0%,100% { opacity: 0.7; transform: scale(0.9) } 50% { opacity: 1; transform: scale(1.08) } }
      .loc-pulse-d { animation: locPulseD 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @media (prefers-reduced-motion: reduce) {
        .loc-pulse-d { animation: none; }
      }
    ]]></style>
  </defs>

  <rect x="0" y="0" width="880" height="150" fill="#14110D"/>
  <rect x="0" y="0" width="880" height="150" fill="url(#loc-hatch-fine-d)" opacity="0.45"/>

  <rect x="14" y="14" width="852" height="122" fill="none" stroke="#EFE4CE" stroke-width="0.6" stroke-dasharray="3 5" opacity="0.45"/>
  <rect x="22" y="22" width="836" height="106" fill="none" stroke="#EFE4CE" stroke-width="1.1" opacity="0.85"/>

  <rect x="22" y="22" width="56" height="10" fill="url(#loc-hatch-d)"/>
  <rect x="22" y="22" width="10" height="56" fill="url(#loc-hatch-d)"/>
  <rect x="802" y="22" width="56" height="10" fill="url(#loc-hatch-d)"/>
  <rect x="848" y="22" width="10" height="56" fill="url(#loc-hatch-d)"/>
  <rect x="22" y="118" width="56" height="10" fill="url(#loc-hatch-d)"/>
  <rect x="22" y="72" width="10" height="56" fill="url(#loc-hatch-d)"/>
  <rect x="802" y="118" width="56" height="10" fill="url(#loc-hatch-d)"/>
  <rect x="848" y="72" width="10" height="56" fill="url(#loc-hatch-d)"/>

  <text x="60" y="46" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="10" letter-spacing="0.2em" fill="#9C8F77">§ PLATE · BASED IN</text>
  <text x="820" y="46" text-anchor="end" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="10" letter-spacing="0.2em" fill="#9C8F77">AS OF 2026 · NL</text>

  <g fill="none" stroke="#9C8F77" stroke-linecap="round" stroke-linejoin="round" opacity="0.7">
    <path d="M120 88 Q190 80 250 88 Q310 96 380 86 Q450 78 520 88 Q590 96 660 86" stroke-width="1.1" stroke-dasharray="0.5 3.4"/>
  </g>
  <path d="M520 88 Q590 96 660 86 Q700 80 736 84" fill="none" stroke="#5BC795" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M730 80 L740 84 L730 88" fill="none" stroke="#5BC795" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>

  <g stroke="#9C8F77" fill="#14110D" stroke-width="1">
    <circle cx="120" cy="88" r="3.2"/>
    <circle cx="250" cy="88" r="3.2"/>
    <circle cx="380" cy="86" r="3.2"/>
    <circle cx="520" cy="88" r="3.2"/>
  </g>
  <circle class="loc-pulse-d" cx="736" cy="84" r="14" fill="url(#loc-pin-glow-d)" stroke="none"/>
  <circle cx="736" cy="84" r="5.8" fill="#5BC795" stroke="none"/>
  <circle cx="736" cy="84" r="2.2" fill="#14110D" stroke="none"/>

  <g transform="translate(736 60)" fill="none" stroke="#5BC795" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 -8 Q-6 -8 -6 -2 Q-6 4 0 10 Q6 4 6 -2 Q6 -8 0 -8 Z" fill="#1D1812"/>
    <circle cx="0" cy="-2" r="1.6" fill="#5BC795" stroke="none"/>
  </g>

  <text x="120" y="112" text-anchor="middle" font-family="EB Garamond, Garamond, Cormorant Garamond, Georgia, serif" font-style="italic" font-size="15" fill="#9C8F77">Shanghai</text>
  <text x="250" y="112" text-anchor="middle" font-family="EB Garamond, Garamond, Cormorant Garamond, Georgia, serif" font-style="italic" font-size="15" fill="#9C8F77">Shenzhen</text>
  <text x="380" y="112" text-anchor="middle" font-family="EB Garamond, Garamond, Cormorant Garamond, Georgia, serif" font-style="italic" font-size="15" fill="#9C8F77">Delft</text>
  <text x="520" y="112" text-anchor="middle" font-family="EB Garamond, Garamond, Cormorant Garamond, Georgia, serif" font-style="italic" font-size="15" fill="#9C8F77">Madrid</text>
  <text x="736" y="112" text-anchor="middle" font-family="EB Garamond, Garamond, Cormorant Garamond, Georgia, serif" font-style="italic" font-weight="500" font-size="17" fill="#EFE4CE">Amsterdam</text>

  <text x="736" y="126" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="9" letter-spacing="0.24em" fill="#5BC795">HERE · NOW</text>
</svg>
