<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" role="img" aria-label="Workshop kit. Tools Tony reaches for, sorted by how often.">
  <title>Workshop kit · the tools, in the order I reach for them</title>
  <desc>An editorial plate showing the development tools Tony uses, organised by frequency. Daily: Python, PyTorch, CUDA, LaTeX. Often: TensorFlow, Unity for XR, TypeScript, C++, Linux. Kept on the shelf for when a project calls for them: React, Node, Docker, C, Git.</desc>

