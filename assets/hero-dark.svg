  <text x="22" y="335" class="ln ln-11" xml:space="preserve" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="15"><tspan fill="#C7C0B2">left my PhD fellowship this spring; clearer now on what&#39;s next.</tspan></text>
  <text x="22" y="359" class="ln ln-12" xml:space="preserve" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="15"><tspan fill="#E0A458">open</tspan><tspan fill="#EFE4CE"> to research · academia or industry</tspan></text>
  <text x="22" y="383" class="ln ln-13" xml:space="preserve" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="15"><tspan fill="#5BC795">~ $ </tspan></text>
