  <text x="22" y="95" class="ln ln-1" xml:space="preserve" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="15"><tspan fill="#E0A458">Tony (Tongyun) Yang · 杨童耘</tspan></text>
  <text x="22" y="119" class="ln ln-2" xml:space="preserve" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="15"><tspan fill="#7C8893">Independent AI Researcher · Amsterdam</tspan></text>
  <text x="22" y="167" class="ln ln-4" xml:space="preserve" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="15"><tspan fill="#5BC795">~ $ </tspan></text><g clip-path="url(#ty-4)"><text x="58.1" y="167" xml:space="preserve" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="15"><tspan fill="#EFE4CE">cat focus.txt</tspan></text></g>
  <text x="22" y="191" class="ln ln-5" xml:space="preserve" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="15"><tspan fill="#EFE4CE">the scaling race is becoming a systems race.</tspan></text>
  <text x="22" y="215" class="ln ln-6" xml:space="preserve" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="15"><tspan fill="#EFE4CE">bigger models still matter, but they are not enough.</tspan></text>
  <text x="22" y="239" class="ln ln-7" xml:space="preserve" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="15"><tspan fill="#EFE4CE">what counts is how we train, route, compress, and ship them.</tspan></text>
  <text x="22" y="263" class="ln ln-8" xml:space="preserve" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="15"><tspan fill="#EFE4CE">building AI that is capable, efficient, and genuinely useful.</tspan></text>
