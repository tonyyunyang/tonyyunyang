<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 446" role="img" aria-label="Workshop kit. Tools Tony reaches for, sorted by how often.">
  <title>Workshop kit · the tools, in the order I reach for them</title>
  <desc>An editorial plate showing the development tools Tony uses, organised by frequency. Daily tools are Python, PyTorch, CUDA, and LaTeX. Often used tools are TensorFlow, Unity for XR, TypeScript, C++, and Linux. Shelf tools are React, Node, Docker, C, and Git.</desc>

  <defs>
    <pattern id="stk-hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(35)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#0F1417" stroke-width="0.45" opacity="0.45"/>
    </pattern>
    <pattern id="stk-hatch-fine" patternUnits="userSpaceOnUse" width="4" height="4" patternTransform="rotate(-30)">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#0F1417" stroke-width="0.3" opacity="0.32"/>
    </pattern>
    <pattern id="stk-hatch-shelf" patternUnits="userSpaceOnUse" width="5" height="5" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#0F1417" stroke-width="0.35" opacity="0.28"/>
    </pattern>

    <style><![CDATA[
      @keyframes stkBlink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
      .stk-blink { animation: stkBlink 1.1s steps(2) infinite; }
      @media (prefers-reduced-motion: reduce) { .stk-blink { animation: none; } }
    ]]></style>

    <!-- ================== ICON SYMBOLS ==================
         Each icon sits in a 40x40 viewport. Drawing area uses ~5 to ~35
         so icons read at the rendered 44 px size. Strokes 1.4-1.8 for
         body. currentColor lets each tier tint the whole set. -->

    <symbol id="ico-python" viewBox="0 0 40 40">
      <!-- Python: two interlocking rounded blocks, one stamped on top
           of the other in the iconic L-rotated geometry. Each piece has
           a small circular eye marking the snake head. -->
      <g stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round">
        <!-- Lower piece drawn first so the upper covers part of it -->
        <path d="M14 38 H26 Q30 38 30 34 V22 H21 Q19 22 19 20 V14 H10 V34 Q10 38 14 38 Z"
              fill="currentColor" fill-opacity="0.45"/>
        <circle cx="26" cy="32" r="1.3" fill="currentColor" stroke="none"/>
        <!-- Upper piece -->
        <path d="M26 2 H14 Q10 2 10 6 V18 H19 Q21 18 21 20 V26 H30 V6 Q30 2 26 2 Z"
              fill="currentColor" fill-opacity="0.18"/>
        <circle cx="14" cy="8" r="1.3" fill="currentColor" stroke="none"/>
      </g>
    </symbol>

    <symbol id="ico-pytorch" viewBox="0 0 40 40">
      <!-- PyTorch: a flame silhouette with a clear V-notch at the top
           (the recognisable PyTorch logo gap), and an inner solid dot
           marking the spark. Body curve is teardrop. -->
      <g stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 4 L17 9 L20 12 L23 9 L20 4 Z M20 12 Q11 17 11 24 Q11 32 20 35 Q29 32 29 24 Q29 18 25 14 L20 12"
              fill="none"/>
        <circle cx="20" cy="22" r="2.2" fill="currentColor" stroke="none"/>
      </g>
    </symbol>

    <symbol id="ico-cuda" viewBox="0 0 40 40">
      <!-- CUDA: a microchip with corner notch (a chip's pin-1 marker),
           an inner die grid, and pin ticks on all four sides. -->
      <g fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 11 H27 L31 15 V30 H14 L10 26 Z"/>
        <rect x="14" y="15" width="13" height="11" fill="currentColor" fill-opacity="0.12" stroke="none"/>
        <line x1="14" y1="18" x2="27" y2="18" opacity="0.6"/>
        <line x1="14" y1="22" x2="27" y2="22" opacity="0.6"/>
        <line x1="18" y1="15" x2="18" y2="26" opacity="0.6"/>
        <line x1="22" y1="15" x2="22" y2="26" opacity="0.6"/>
        <g opacity="0.85" stroke-width="1">
          <line x1="14" y1="11" x2="14" y2="8"/>
          <line x1="18" y1="11" x2="18" y2="8"/>
          <line x1="22" y1="11" x2="22" y2="8"/>
          <line x1="26" y1="11" x2="26" y2="8"/>
          <line x1="14" y1="30" x2="14" y2="33"/>
          <line x1="18" y1="30" x2="18" y2="33"/>
          <line x1="22" y1="30" x2="22" y2="33"/>
          <line x1="26" y1="30" x2="26" y2="33"/>
          <line x1="10" y1="14" x2="7" y2="14"/>
          <line x1="10" y1="18" x2="7" y2="18"/>
          <line x1="10" y1="22" x2="7" y2="22"/>
          <line x1="31" y1="18" x2="34" y2="18"/>
          <line x1="31" y1="22" x2="34" y2="22"/>
          <line x1="31" y1="26" x2="34" y2="26"/>
        </g>
      </g>
    </symbol>

    <symbol id="ico-latex" viewBox="0 0 40 40">
      <!-- LaTeX: the actual wordmark with raised A, lowered E. Letters
           positioned with proper kerning so they never collide. -->
      <g font-family="EB Garamond, Garamond, Cormorant Garamond, Georgia, serif" fill="currentColor" stroke="none">
        <text x="3" y="28" font-size="16" font-weight="500">L</text>
        <text x="9" y="20" font-size="9" font-weight="500">A</text>
        <text x="14" y="28" font-size="16">T</text>
        <text x="22" y="32" font-size="9">E</text>
        <text x="28" y="28" font-size="16">X</text>
      </g>
      <line x1="6" y1="33" x2="34" y2="33" stroke="currentColor" stroke-width="0.7" opacity="0.45"/>
    </symbol>

    <symbol id="ico-tensorflow" viewBox="0 0 40 40">
      <!-- TensorFlow: angled blocks forming a T with subtle 3D depth.
           Top horizontal slab plus vertical stem. -->
      <g stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 8 L28 8 L31 12 L11 12 Z" fill="currentColor" fill-opacity="0.18"/>
        <path d="M16 12 L24 12 L24 33 L20 33 L20 16 L16 16 Z" fill="currentColor" fill-opacity="0.34"/>
        <path d="M16 12 V16 H20 V33" opacity="0.7" fill="none"/>
        <path d="M28 8 L31 12 L31 14" opacity="0.55" fill="none"/>
      </g>
    </symbol>

    <symbol id="ico-unity" viewBox="0 0 40 40">
      <!-- Unity: isometric cube with three visible faces and a small
           triangular Y-section inside (Unity's signature negative-space
           Y at the cube's centre). -->
      <g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 5 L33 12 V27 L20 35 L7 27 V12 Z"/>
        <path d="M20 5 V20 L33 12 M20 20 L7 12 M20 20 V35" stroke-width="1" opacity="0.7"/>
        <path d="M20 12 L25 16 L20 23 L15 16 Z" stroke-width="1" fill="currentColor" fill-opacity="0.18"/>
        <circle cx="20" cy="18" r="1.2" fill="currentColor" stroke="none"/>
      </g>
    </symbol>

    <symbol id="ico-typescript" viewBox="0 0 40 40">
      <!-- TypeScript: filled corner-rounded square containing the bold
           "TS" letterform. Closer to the real brand mark. -->
      <g stroke="currentColor" stroke-width="1.4" stroke-linejoin="round">
        <rect x="6" y="6" width="28" height="28" rx="3" fill="currentColor" fill-opacity="0.16"/>
        <path d="M11 16 H22 M16.5 16 V28" stroke-width="1.7" stroke-linecap="round" fill="none"/>
        <path d="M30 19 Q26 19 26 22 Q26 25 28.5 25 Q31 25 31 28 Q31 31 26.5 31" stroke-width="1.5" stroke-linecap="round" fill="none"/>
      </g>
    </symbol>

    <symbol id="ico-cpp" viewBox="0 0 40 40">
      <!-- C++: a substantial C arc with two bold plus signs. Stroke
           weights are tuned so the pluses read as solid marks. -->
      <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 9 Q7 9 7 20 Q7 31 21 31" stroke-width="2"/>
        <line x1="25" y1="15" x2="25" y2="25" stroke-width="2"/>
        <line x1="20" y1="20" x2="30" y2="20" stroke-width="2"/>
        <line x1="34" y1="15" x2="34" y2="25" stroke-width="2"/>
        <line x1="29" y1="20" x2="39" y2="20" stroke-width="2"/>
      </g>
    </symbol>

    <symbol id="ico-linux" viewBox="0 0 40 40">
      <!-- Linux: a clearer Tux. Body and head are one continuous
           pear silhouette so they don't read as overlapping circles.
           White belly is an interior shape. Beak and feet are filled. -->
      <g stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.3">
        <!-- Continuous body silhouette: head → shoulders → bottom -->
        <path d="M20 4 Q14 4 14 10 V12 Q11 13 11 18 Q11 24 11 28 Q11 33 14 35 H26 Q29 33 29 28 Q29 24 29 18 Q29 13 26 12 V10 Q26 4 20 4 Z"
              fill="currentColor" fill-opacity="0.18"/>
        <!-- White belly oval -->
        <path d="M16 28 Q16 22 20 22 Q24 22 24 28 Q24 33 22 34 H18 Q16 33 16 28 Z"
              fill="currentColor" fill-opacity="0" opacity="0.55"/>
        <!-- Eyes -->
        <ellipse cx="17.5" cy="9.5" rx="1" ry="1.4" fill="currentColor" stroke="none"/>
        <ellipse cx="22.5" cy="9.5" rx="1" ry="1.4" fill="currentColor" stroke="none"/>
        <!-- Beak triangle -->
        <path d="M17.5 12.5 L20 14.5 L22.5 12.5 L20 11.5 Z" fill="currentColor" fill-opacity="0.65" stroke-width="0.8"/>
        <!-- Feet -->
        <path d="M16 35 L13 38 H17 Z" fill="currentColor" fill-opacity="0.55" stroke-width="0.8"/>
        <path d="M24 35 L27 38 H23 Z" fill="currentColor" fill-opacity="0.55" stroke-width="0.8"/>
      </g>
    </symbol>

    <symbol id="ico-react" viewBox="0 0 40 40">
      <!-- React: three crossed orbital ellipses with a strong nucleus.
           Slight stroke-weight variance so the orbits read individually. -->
      <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.2">
        <ellipse cx="20" cy="20" rx="13" ry="5"/>
        <ellipse cx="20" cy="20" rx="13" ry="5" transform="rotate(60 20 20)"/>
        <ellipse cx="20" cy="20" rx="13" ry="5" transform="rotate(120 20 20)"/>
      </g>
      <circle cx="20" cy="20" r="2.4" fill="currentColor"/>
    </symbol>

    <symbol id="ico-node" viewBox="0 0 40 40">
      <!-- Node.js: hexagon with a tilted N inside. Filled at low alpha
           so the silhouette reads as a solid badge. -->
      <g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round">
        <path d="M20 4 L33 11 V25 Q33 27 31.5 28 L21 34 Q20 34.5 19 34 L8.5 28 Q7 27 7 25 V11 Z"
              fill="currentColor" fill-opacity="0.10"/>
      </g>
      <text x="20" y="25" text-anchor="middle" font-family="EB Garamond, Garamond, Georgia, serif" font-style="italic" font-size="14" font-weight="500" fill="currentColor">N</text>
    </symbol>

    <symbol id="ico-docker" viewBox="0 0 40 40">
      <!-- Docker: a clearer whale with a stacked container ship. The
           container blocks sit on the whale's back, with a spout and a
           tail. Whale body is filled at low alpha for presence. -->
      <g stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.3" fill="none">
        <!-- Container blocks (3 + 2 stacked) -->
        <rect x="8" y="17" width="5" height="5" fill="currentColor" fill-opacity="0.18"/>
        <rect x="14" y="17" width="5" height="5" fill="currentColor" fill-opacity="0.18"/>
        <rect x="20" y="17" width="5" height="5" fill="currentColor" fill-opacity="0.18"/>
        <rect x="11" y="11" width="5" height="5" fill="currentColor" fill-opacity="0.18"/>
        <rect x="17" y="11" width="5" height="5" fill="currentColor" fill-opacity="0.18"/>
        <!-- Whale spout (3 small dots) -->
        <path d="M28 13 Q29 10 31 11 Q32 12 31 13" stroke-width="1" opacity="0.7"/>
        <!-- Whale body (curved hull) -->
        <path d="M5 23 Q4 30 11 31 H27 Q34 31 36 26 L33 24 Q31 24 30 26"
              fill="currentColor" fill-opacity="0.10" stroke-width="1.4"/>
        <!-- Whale eye -->
        <circle cx="32" cy="27" r="0.6" fill="currentColor" stroke="none"/>
        <!-- Tail flick -->
        <path d="M5 23 Q1 22 1 26 Q3 25 5 26" stroke-width="1" opacity="0.7"/>
      </g>
    </symbol>

    <symbol id="ico-c" viewBox="0 0 40 40">
      <!-- C: a bold serif-styled C inside a soft circular badge ring -->
      <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="20" cy="20" r="13" opacity="0.4" stroke-width="1.2"/>
        <path d="M27 12 Q11 12 11 20 Q11 28 27 28" stroke-width="2"/>
        <!-- tiny serifs at the C ends -->
        <path d="M25 12 V14 M25 28 V26" stroke-width="1.2" opacity="0.8"/>
      </g>
    </symbol>

    <symbol id="ico-git" viewBox="0 0 40 40">
      <!-- Git: a branching graph with three nodes and connecting lines
           plus a small merge dot at the bottom node centre. -->
      <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 33 V21"/>
        <path d="M20 21 L11 9"/>
        <path d="M20 21 L29 9"/>
      </g>
      <g fill="currentColor">
        <circle cx="20" cy="34" r="2.6"/>
        <circle cx="11" cy="8" r="2.6"/>
        <circle cx="29" cy="8" r="2.6"/>
      </g>
      <g fill="none" stroke="currentColor" stroke-width="0.7" opacity="0.55" stroke-linecap="round">
        <path d="M11 11 V14 L13 16"/>
        <path d="M29 11 V14 L27 16"/>
      </g>
    </symbol>
  </defs>

  <!-- Page -->
  <rect x="0" y="0" width="880" height="446" fill="#F5EFE2"/>
  <rect x="0" y="0" width="880" height="446" fill="url(#stk-hatch-fine)" opacity="0.22"/>

  <!-- Outer dashed + inner solid frame -->
  <rect x="14" y="14" width="852" height="418" fill="none" stroke="#0F1417" stroke-width="0.7" stroke-dasharray="3 5" opacity="0.55"/>
  <rect x="22" y="22" width="836" height="402" fill="none" stroke="#0F1417" stroke-width="1.2"/>

  <!-- Hatched engraving corners -->
  <rect x="22" y="22" width="64" height="12" fill="url(#stk-hatch)"/>
  <rect x="22" y="22" width="12" height="64" fill="url(#stk-hatch)"/>
  <rect x="794" y="22" width="64" height="12" fill="url(#stk-hatch)"/>
  <rect x="846" y="22" width="12" height="64" fill="url(#stk-hatch)"/>
  <rect x="22" y="412" width="64" height="12" fill="url(#stk-hatch)"/>
  <rect x="22" y="360" width="12" height="64" fill="url(#stk-hatch)"/>
  <rect x="794" y="412" width="64" height="12" fill="url(#stk-hatch)"/>
  <rect x="846" y="360" width="12" height="64" fill="url(#stk-hatch)"/>

  <!-- Header colophons -->
  <text x="60" y="50" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="0.2em" fill="#4A5159">§ PLATE GH · STACK · WORKSHOP KIT</text>
  <text x="820" y="50" text-anchor="end" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="0.2em" fill="#4A5159">SHARPENED · 2026</text>

  <!-- Hairline under header -->
  <path d="M60 64 H820" stroke="#D9D2C2" stroke-width="0.7"/>

  <!-- ================== TIER 1 · DAILY ================== -->
  <!-- Tier label, italic display, accent. Vertically centred against
       the shelf strip so the left column reads as one calm word. -->
  <g>
    <text x="60" y="124" font-family="EB Garamond, Garamond, Cormorant Garamond, Georgia, serif" font-style="italic" font-size="26" fill="#0E5347">daily</text>
    <!-- Hatched shelf strip behind icons -->
    <rect x="220" y="84" width="612" height="64" fill="url(#stk-hatch-shelf)" opacity="0.7"/>
    <!-- Top + bottom hairlines on the shelf strip -->
    <path d="M220 84 H832" stroke="#0E5347" stroke-width="0.5" opacity="0.6"/>
    <path d="M220 148 H832" stroke="#0E5347" stroke-width="0.5" opacity="0.6"/>

    <!-- 4 tools: spaced from 240 to 812, step ~190 -->
    <g color="#0E5347">
      <use href="#ico-python" x="266" y="92" width="40" height="40"/>
      <use href="#ico-pytorch" x="436" y="92" width="40" height="40"/>
      <use href="#ico-cuda" x="606" y="92" width="40" height="40"/>
      <use href="#ico-latex" x="776" y="92" width="40" height="40"/>
    </g>
  </g>
  <!-- Tool names -->
  <g font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="0.16em" fill="#0F1417" text-anchor="middle">
    <text x="286" y="170">PYTHON</text>
    <text x="456" y="170">PYTORCH</text>
    <text x="626" y="170">CUDA</text>
    <text x="796" y="170">LATEX</text>
  </g>

  <!-- ================== TIER 2 · OFTEN ================== -->
  <g>
    <text x="60" y="240" font-family="EB Garamond, Garamond, Cormorant Garamond, Georgia, serif" font-style="italic" font-size="24" fill="#0F1417">often</text>
    <rect x="220" y="202" width="612" height="60" fill="url(#stk-hatch-shelf)" opacity="0.5"/>
    <path d="M220 202 H832" stroke="#0F1417" stroke-width="0.5" opacity="0.4"/>
    <path d="M220 262 H832" stroke="#0F1417" stroke-width="0.5" opacity="0.4"/>

    <!-- 5 tools: spaced from 220 to 832, step ~120 -->
    <g color="#0F1417">
      <use href="#ico-tensorflow" x="246" y="208" width="40" height="40"/>
      <use href="#ico-unity" x="370" y="208" width="40" height="40"/>
      <use href="#ico-typescript" x="494" y="208" width="40" height="40"/>
      <use href="#ico-cpp" x="618" y="208" width="40" height="40"/>
      <use href="#ico-linux" x="742" y="208" width="40" height="40"/>
    </g>
  </g>
  <g font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="10" letter-spacing="0.16em" fill="#0F1417" text-anchor="middle">
    <text x="266" y="280">TENSORFLOW</text>
    <text x="390" y="280">UNITY · XR</text>
    <text x="514" y="280">TYPESCRIPT</text>
    <text x="638" y="280">C++</text>
    <text x="762" y="280">LINUX</text>
  </g>

  <!-- ================== TIER 3 · ON THE SHELF ================== -->
  <g>
    <text x="60" y="348" font-family="EB Garamond, Garamond, Cormorant Garamond, Georgia, serif" font-style="italic" font-size="24" fill="#4A5159">on the shelf</text>
    <rect x="220" y="310" width="612" height="60" fill="url(#stk-hatch-shelf)" opacity="0.4"/>
    <path d="M220 310 H832" stroke="#4A5159" stroke-width="0.5" opacity="0.4"/>
    <path d="M220 370 H832" stroke="#4A5159" stroke-width="0.5" opacity="0.4"/>

    <g color="#4A5159">
      <use href="#ico-react" x="246" y="316" width="40" height="40"/>
      <use href="#ico-node" x="370" y="316" width="40" height="40"/>
      <use href="#ico-docker" x="494" y="316" width="40" height="40"/>
      <use href="#ico-c" x="618" y="316" width="40" height="40"/>
      <use href="#ico-git" x="742" y="316" width="40" height="40"/>
    </g>
  </g>
  <g font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="10" letter-spacing="0.16em" fill="#4A5159" text-anchor="middle">
    <text x="266" y="388">REACT</text>
    <text x="390" y="388">NODE.JS</text>
    <text x="514" y="388">DOCKER</text>
    <text x="638" y="388">C</text>
    <text x="762" y="388">GIT</text>
  </g>

  <!-- Bottom signature -->
  <text x="60" y="416" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="9" letter-spacing="0.22em" fill="#4A5159">SHARPENED · OILED · KEPT WHERE THE LIGHT IS</text>
  <text x="820" y="416" text-anchor="end" font-family="EB Garamond, Garamond, Cormorant Garamond, Georgia, serif" font-style="italic" font-size="13" fill="#4A5159">tools wear in, not out.</text>
</svg>
