<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 446" role="img" aria-label="Workshop kit. Tools Tony reaches for, sorted by how often.">
  <title>Workshop kit · the tools, in the order I reach for them</title>
  <desc>An editorial plate showing the development tools Tony uses, organised by frequency. Daily tools are Python, PyTorch, CUDA, and LaTeX. Often used tools are TensorFlow, Unity for XR, TypeScript, C++, and Linux. Shelf tools are React, Node, Docker, C, and Git.</desc>

  <defs>
    <pattern id="stk-hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(35)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#0F1417" stroke-width="0.45" opacity="0.45"/>
    </pattern>
    <pattern id="stk-hatch-fine" patternUnits="userSpaceOnUse" width="4" height="4" patternTransform="rotate(-30)">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#0F1417" stroke-width="0.3" opacity="0.32"/>
    </pattern>
    <pattern id="stk-hatch-shelf" patternUnits="userSpaceOnUse" width="5" height="5" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#0F1417" stroke-width="0.35" opacity="0.28"/>
    </pattern>

    <style><![CDATA[
      @keyframes stkBlink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
      .stk-blink { animation: stkBlink 1.1s steps(2) infinite; }
      @media (prefers-reduced-motion: reduce) { .stk-blink { animation: none; } }
    ]]></style>

    <!-- ================== ICON SYMBOLS ==================
         Each icon sits in a 40x40 viewport, centred. Single-line
         hand drawn feel: stroke 1.2, round caps, ink colour by default
         (use currentColor so we can tint per tier). -->

    <symbol id="ico-python" viewBox="0 0 40 40">
      <!-- Two interlocking serpent-droplets, the Python double-snake mark.
           Top drop curls left, bottom drop curls right. Eye dots indicate
           heads. Filled rounded shapes make the pair recognisable at
           small sizes. -->
      <g stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round">
        <path d="M16 6 Q9 6 9 13 V18 H22 Q24 18 24 20 V22 H14 Q11 22 11 24" fill="none"/>
        <circle cx="12.5" cy="9.5" r="1" fill="currentColor" stroke="none"/>
        <path d="M24 34 Q31 34 31 27 V22 H18 Q16 22 16 20 V18 H26 Q29 18 29 16" fill="none" opacity="0.78"/>
        <circle cx="27.5" cy="30.5" r="1" fill="currentColor" stroke="none" opacity="0.78"/>
      </g>
    </symbol>

    <symbol id="ico-pytorch" viewBox="0 0 40 40">
      <!-- A flame with a sharp tip and a curl at the base, plus the
           characteristic notched "torch" gap on top. Dot for the spark. -->
      <g fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 5 L17 10 Q11 16 11 23 Q11 31 20 34 Q29 31 29 23 Q29 16 24 12 L20 5 Z"/>
        <circle cx="20" cy="22" r="1.8" fill="currentColor" stroke="none"/>
      </g>
    </symbol>

    <symbol id="ico-cuda" viewBox="0 0 40 40">
      <!-- A microchip: square with corner notch and pin ticks -->
      <g fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 12 H26 L30 16 V30 H14 L10 26 Z"/>
        <path d="M14 18 H26 M14 22 H26 M14 26 H26" opacity="0.7"/>
        <!-- Pins -->
        <path d="M10 16 H7 M10 20 H7 M10 24 H7 M30 18 H33 M30 22 H33 M30 26 H33 M14 30 V33 M18 30 V33 M22 30 V33 M14 12 V9 M18 12 V9 M22 12 V9" opacity="0.7"/>
      </g>
    </symbol>

    <symbol id="ico-latex" viewBox="0 0 40 40">
      <!-- A typeset page: serif L with a tiny ornament + ruled lines -->
      <g fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 9 H31 V31 H9 Z" opacity="0.5"/>
        <text x="13" y="24" font-family="EB Garamond, Garamond, Georgia, serif" font-size="14" font-weight="500" fill="currentColor" stroke="none">L</text>
        <text x="20" y="28" font-family="EB Garamond, Garamond, Georgia, serif" font-style="italic" font-size="9" fill="currentColor" stroke="none">a</text>
        <text x="24" y="22" font-family="EB Garamond, Garamond, Georgia, serif" font-size="11" fill="currentColor" stroke="none">T</text>
        <text x="29" y="26" font-family="EB Garamond, Garamond, Georgia, serif" font-size="10" fill="currentColor" stroke="none">X</text>
      </g>
    </symbol>

    <symbol id="ico-tensorflow" viewBox="0 0 40 40">
      <!-- A blocky T mark, the bar on top and a stem below. -->
      <g fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="9" width="22" height="6"/>
        <rect x="17" y="15" width="6" height="17"/>
        <line x1="13" y1="12" x2="27" y2="12" opacity="0.55"/>
        <line x1="20" y1="20" x2="20" y2="28" opacity="0.55"/>
      </g>
    </symbol>

    <symbol id="ico-unity" viewBox="0 0 40 40">
      <!-- Isometric cube wireframe -->
      <g fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 8 L31 14 V26 L20 32 L9 26 V14 Z"/>
        <path d="M20 8 V20 L31 14 M20 20 L9 14 M20 20 V32" opacity="0.7"/>
        <circle cx="20" cy="20" r="1.2" fill="currentColor" stroke="none"/>
      </g>
    </symbol>

    <symbol id="ico-typescript" viewBox="0 0 40 40">
      <!-- Angle brackets framing a thin line -->
      <g fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M13 14 L7 20 L13 26"/>
        <path d="M27 14 L33 20 L27 26"/>
        <path d="M16 28 L24 12" opacity="0.7"/>
      </g>
    </symbol>

    <symbol id="ico-cpp" viewBox="0 0 40 40">
      <!-- An open C with two bold plus signs to its right -->
      <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 11 Q9 11 9 20 Q9 29 21 29" stroke-width="1.4"/>
        <path d="M25 16 V24 M21 20 H29" stroke-width="1.6"/>
        <path d="M33 16 V24 M29 20 H37" stroke-width="1.6"/>
      </g>
    </symbol>

    <symbol id="ico-linux" viewBox="0 0 40 40">
      <!-- A clean Tux silhouette: round head with beak, body egg, feet. -->
      <g fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
        <!-- head -->
        <path d="M14 13 Q14 7 20 7 Q26 7 26 13 Q26 16 24 18"/>
        <!-- body (rounded egg) -->
        <path d="M12 28 Q12 18 20 16 Q28 18 28 28 Q28 32 25 33 H15 Q12 32 12 28 Z" fill="currentColor" fill-opacity="0.06"/>
        <!-- white belly -->
        <path d="M16 28 Q16 22 20 22 Q24 22 24 28 Q24 31 22 32 H18 Q16 31 16 28 Z" opacity="0.45"/>
        <!-- eyes -->
        <circle cx="18" cy="12" r="0.7" fill="currentColor" stroke="none"/>
        <circle cx="22" cy="12" r="0.7" fill="currentColor" stroke="none"/>
        <!-- beak (yellow, here as accent fill) -->
        <path d="M18 14.5 L20 16.5 L22 14.5 L20 13.5 Z" fill="currentColor" fill-opacity="0.6" stroke="none"/>
        <!-- feet -->
        <path d="M16 33 L13 36 M24 33 L27 36"/>
      </g>
    </symbol>

    <symbol id="ico-react" viewBox="0 0 40 40">
      <!-- Three orbital ellipses with a center dot -->
      <g fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
        <ellipse cx="20" cy="20" rx="11" ry="4"/>
        <ellipse cx="20" cy="20" rx="11" ry="4" transform="rotate(60 20 20)"/>
        <ellipse cx="20" cy="20" rx="11" ry="4" transform="rotate(120 20 20)"/>
      </g>
      <circle cx="20" cy="20" r="1.8" fill="currentColor"/>
    </symbol>

    <symbol id="ico-node" viewBox="0 0 40 40">
      <!-- Hexagon with a small node mark inside -->
      <g fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 8 L31 14 V26 L20 32 L9 26 V14 Z"/>
        <text x="20" y="24" text-anchor="middle" font-family="JetBrains Mono, Menlo, monospace" font-size="9" font-weight="500" fill="currentColor" stroke="none">N</text>
      </g>
    </symbol>

    <symbol id="ico-docker" viewBox="0 0 40 40">
      <!-- A whale carrying stacked containers, simplified: two rows of
           square cells (the containers) sitting on a curved whale back. -->
      <g fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
        <!-- container row 1 (3 cells) -->
        <rect x="9" y="17" width="5" height="5"/>
        <rect x="15" y="17" width="5" height="5"/>
        <rect x="21" y="17" width="5" height="5"/>
        <!-- container row 2 (2 cells, offset) -->
        <rect x="12" y="11" width="5" height="5"/>
        <rect x="18" y="11" width="5" height="5"/>
        <!-- whale spout -->
        <path d="M30 14 Q31 11 33 13" opacity="0.7"/>
        <!-- whale body curve -->
        <path d="M6 24 Q6 28 12 30 H28 Q34 30 36 26 L33 24 Q31 23 29 25" stroke-width="1.3"/>
        <!-- tail flick -->
        <path d="M5 22 Q3 23 4 26" opacity="0.7"/>
      </g>
    </symbol>

    <symbol id="ico-c" viewBox="0 0 40 40">
      <!-- A simple letter C in a circle -->
      <g fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="20" cy="20" r="11" opacity="0.5"/>
        <path d="M25 14 Q15 14 15 20 Q15 26 25 26"/>
      </g>
    </symbol>

    <symbol id="ico-git" viewBox="0 0 40 40">
      <!-- A simple Y-fork. Three nodes, branches diverging upward. -->
      <g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 30 V20"/>
        <path d="M20 20 L12 10"/>
        <path d="M20 20 L28 10"/>
        <circle cx="20" cy="32" r="2.2" fill="currentColor"/>
        <circle cx="12" cy="9" r="2.2" fill="currentColor"/>
        <circle cx="28" cy="9" r="2.2" fill="currentColor"/>
      </g>
    </symbol>
  </defs>

  <!-- Page -->
  <rect x="0" y="0" width="880" height="446" fill="#F5EFE2"/>
  <rect x="0" y="0" width="880" height="446" fill="url(#stk-hatch-fine)" opacity="0.22"/>

  <!-- Outer dashed + inner solid frame -->
  <rect x="14" y="14" width="852" height="418" fill="none" stroke="#0F1417" stroke-width="0.7" stroke-dasharray="3 5" opacity="0.55"/>
  <rect x="22" y="22" width="836" height="402" fill="none" stroke="#0F1417" stroke-width="1.2"/>

  <!-- Hatched engraving corners -->
  <rect x="22" y="22" width="64" height="12" fill="url(#stk-hatch)"/>
  <rect x="22" y="22" width="12" height="64" fill="url(#stk-hatch)"/>
  <rect x="794" y="22" width="64" height="12" fill="url(#stk-hatch)"/>
  <rect x="846" y="22" width="12" height="64" fill="url(#stk-hatch)"/>
  <rect x="22" y="412" width="64" height="12" fill="url(#stk-hatch)"/>
  <rect x="22" y="360" width="12" height="64" fill="url(#stk-hatch)"/>
  <rect x="794" y="412" width="64" height="12" fill="url(#stk-hatch)"/>
  <rect x="846" y="360" width="12" height="64" fill="url(#stk-hatch)"/>

  <!-- Header colophons -->
  <text x="60" y="50" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="0.2em" fill="#4A5159">§ PLATE GH · STACK · WORKSHOP KIT</text>
  <text x="820" y="50" text-anchor="end" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="0.2em" fill="#4A5159">SHARPENED · 2026</text>

  <!-- Hairline under header -->
  <path d="M60 64 H820" stroke="#D9D2C2" stroke-width="0.7"/>

  <!-- ================== TIER 1 · DAILY ================== -->
  <!-- Tier label, italic display, accent. Vertically centred against
       the shelf strip so the left column reads as one calm word. -->
  <g>
    <text x="60" y="124" font-family="EB Garamond, Garamond, Cormorant Garamond, Georgia, serif" font-style="italic" font-size="26" fill="#0E5347">daily</text>
    <!-- Hatched shelf strip behind icons -->
    <rect x="220" y="84" width="612" height="64" fill="url(#stk-hatch-shelf)" opacity="0.7"/>
    <!-- Top + bottom hairlines on the shelf strip -->
    <path d="M220 84 H832" stroke="#0E5347" stroke-width="0.5" opacity="0.6"/>
    <path d="M220 148 H832" stroke="#0E5347" stroke-width="0.5" opacity="0.6"/>

    <!-- 4 tools: spaced from 240 to 812, step ~190 -->
    <g color="#0E5347">
      <use href="#ico-python" x="266" y="92" width="40" height="40"/>
      <use href="#ico-pytorch" x="436" y="92" width="40" height="40"/>
      <use href="#ico-cuda" x="606" y="92" width="40" height="40"/>
      <use href="#ico-latex" x="776" y="92" width="40" height="40"/>
    </g>
  </g>
  <!-- Tool names -->
  <g font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="0.16em" fill="#0F1417" text-anchor="middle">
    <text x="286" y="170">PYTHON</text>
    <text x="456" y="170">PYTORCH</text>
    <text x="626" y="170">CUDA</text>
    <text x="796" y="170">LATEX</text>
  </g>

  <!-- ================== TIER 2 · OFTEN ================== -->
  <g>
    <text x="60" y="240" font-family="EB Garamond, Garamond, Cormorant Garamond, Georgia, serif" font-style="italic" font-size="24" fill="#0F1417">often</text>
    <rect x="220" y="202" width="612" height="60" fill="url(#stk-hatch-shelf)" opacity="0.5"/>
    <path d="M220 202 H832" stroke="#0F1417" stroke-width="0.5" opacity="0.4"/>
    <path d="M220 262 H832" stroke="#0F1417" stroke-width="0.5" opacity="0.4"/>

    <!-- 5 tools: spaced from 220 to 832, step ~120 -->
    <g color="#0F1417">
      <use href="#ico-tensorflow" x="246" y="208" width="40" height="40"/>
      <use href="#ico-unity" x="370" y="208" width="40" height="40"/>
      <use href="#ico-typescript" x="494" y="208" width="40" height="40"/>
      <use href="#ico-cpp" x="618" y="208" width="40" height="40"/>
      <use href="#ico-linux" x="742" y="208" width="40" height="40"/>
    </g>
  </g>
  <g font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="10" letter-spacing="0.16em" fill="#0F1417" text-anchor="middle">
    <text x="266" y="280">TENSORFLOW</text>
    <text x="390" y="280">UNITY · XR</text>
    <text x="514" y="280">TYPESCRIPT</text>
    <text x="638" y="280">C++</text>
    <text x="762" y="280">LINUX</text>
  </g>

  <!-- ================== TIER 3 · ON THE SHELF ================== -->
  <g>
    <text x="60" y="348" font-family="EB Garamond, Garamond, Cormorant Garamond, Georgia, serif" font-style="italic" font-size="24" fill="#4A5159">on the shelf</text>
    <rect x="220" y="310" width="612" height="60" fill="url(#stk-hatch-shelf)" opacity="0.4"/>
    <path d="M220 310 H832" stroke="#4A5159" stroke-width="0.5" opacity="0.4"/>
    <path d="M220 370 H832" stroke="#4A5159" stroke-width="0.5" opacity="0.4"/>

    <g color="#4A5159">
      <use href="#ico-react" x="246" y="316" width="40" height="40"/>
      <use href="#ico-node" x="370" y="316" width="40" height="40"/>
      <use href="#ico-docker" x="494" y="316" width="40" height="40"/>
      <use href="#ico-c" x="618" y="316" width="40" height="40"/>
      <use href="#ico-git" x="742" y="316" width="40" height="40"/>
    </g>
  </g>
  <g font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="10" letter-spacing="0.16em" fill="#4A5159" text-anchor="middle">
    <text x="266" y="388">REACT</text>
    <text x="390" y="388">NODE.JS</text>
    <text x="514" y="388">DOCKER</text>
    <text x="638" y="388">C</text>
    <text x="762" y="388">GIT</text>
  </g>

  <!-- Bottom signature -->
  <text x="60" y="416" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="9" letter-spacing="0.22em" fill="#4A5159">SHARPENED · OILED · KEPT WHERE THE LIGHT IS</text>
  <text x="820" y="416" text-anchor="end" font-family="EB Garamond, Garamond, Cormorant Garamond, Georgia, serif" font-style="italic" font-size="13" fill="#4A5159">tools wear in, not out.</text>
</svg>
