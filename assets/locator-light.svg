<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 150" role="img" aria-label="Now in Amsterdam. Route: Shanghai, Shenzhen, Delft, Madrid, Amsterdam.">
  <title>Now in Amsterdam · the route in order</title>
  <desc>A small editorial plate showing the cities Tony has lived in, drawn as a hand-routed line. The current city is the filled accent dot at the right end.</desc>

  <defs>
    <pattern id="loc-hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(35)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#0F1417" stroke-width="0.45" opacity="0.45"/>
    </pattern>
    <pattern id="loc-hatch-fine" patternUnits="userSpaceOnUse" width="4" height="4" patternTransform="rotate(-30)">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#0F1417" stroke-width="0.3" opacity="0.32"/>
    </pattern>
    <radialGradient id="loc-pin-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FAF1D8" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FAF1D8" stop-opacity="0"/>
    </radialGradient>
    <style><![CDATA[
      @keyframes locPulse { 0%,100% { opacity: 0.7; transform: scale(0.9) } 50% { opacity: 1; transform: scale(1.08) } }
      .loc-pulse { animation: locPulse 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @media (prefers-reduced-motion: reduce) {
        .loc-pulse { animation: none; }
      }
    ]]></style>
  </defs>

  <!-- Page -->
  <rect x="0" y="0" width="880" height="150" fill="#F5EFE2"/>
  <rect x="0" y="0" width="880" height="150" fill="url(#loc-hatch-fine)" opacity="0.22"/>

  <!-- Outer dashed + inner solid frame -->
  <rect x="14" y="14" width="852" height="122" fill="none" stroke="#0F1417" stroke-width="0.6" stroke-dasharray="3 5" opacity="0.5"/>
  <rect x="22" y="22" width="836" height="106" fill="none" stroke="#0F1417" stroke-width="1.1"/>

  <!-- Hatched engraving corners -->
  <rect x="22" y="22" width="56" height="10" fill="url(#loc-hatch)"/>
  <rect x="22" y="22" width="10" height="56" fill="url(#loc-hatch)"/>
  <rect x="802" y="22" width="56" height="10" fill="url(#loc-hatch)"/>
  <rect x="848" y="22" width="10" height="56" fill="url(#loc-hatch)"/>
  <rect x="22" y="118" width="56" height="10" fill="url(#loc-hatch)"/>
  <rect x="22" y="72" width="10" height="56" fill="url(#loc-hatch)"/>
  <rect x="802" y="118" width="56" height="10" fill="url(#loc-hatch)"/>
  <rect x="848" y="72" width="10" height="56" fill="url(#loc-hatch)"/>

  <!-- Top colophons -->
  <text x="60" y="46" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="10" letter-spacing="0.2em" fill="#4A5159">§ PLATE · BASED IN</text>
  <text x="820" y="46" text-anchor="end" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="10" letter-spacing="0.2em" fill="#4A5159">AS OF 2026 · NL</text>

  <!-- Hand-drawn route line. Slightly squiggly, drawn in two pen strokes -->
  <g fill="none" stroke="#4A5159" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <!-- past route (lighter, dashed feel via stroke-dasharray) -->
    <path d="M120 88 Q190 80 250 88 Q310 96 380 86 Q450 78 520 88 Q590 96 660 86" stroke-width="1.1" stroke-dasharray="0.5 3.4"/>
  </g>
  <!-- accent segment connecting Madrid to Amsterdam (the most recent leg) -->
  <path d="M520 88 Q590 96 660 86 Q700 80 736 84" fill="none" stroke="#0E5347" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Direction tick at the end of the accent segment, before Amsterdam -->
  <path d="M730 80 L740 84 L730 88" fill="none" stroke="#0E5347" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Five city nodes, evenly spaced -->
  <!-- Past nodes: open circles -->
  <g stroke="#4A5159" fill="#F5EFE2" stroke-width="1">
    <circle cx="120" cy="88" r="3.2"/>
    <circle cx="250" cy="88" r="3.2"/>
    <circle cx="380" cy="86" r="3.2"/>
    <circle cx="520" cy="88" r="3.2"/>
  </g>
  <!-- Current node: pulsing halo + filled accent dot + small "you are here" pin -->
  <circle class="loc-pulse" cx="736" cy="84" r="14" fill="url(#loc-pin-glow)" stroke="none"/>
  <circle cx="736" cy="84" r="5.8" fill="#0E5347" stroke="none"/>
  <circle cx="736" cy="84" r="2.2" fill="#FAF1D8" stroke="none"/>

  <!-- Tiny pin (downward triangle) above Amsterdam node -->
  <g transform="translate(736 60)" fill="none" stroke="#0E5347" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 -8 Q-6 -8 -6 -2 Q-6 4 0 10 Q6 4 6 -2 Q6 -8 0 -8 Z" fill="#FAF1D8"/>
    <circle cx="0" cy="-2" r="1.6" fill="#0E5347" stroke="none"/>
  </g>

  <!-- City names · EB Garamond italic, baseline-aligned to ~110 -->
  <text x="120" y="112" text-anchor="middle" font-family="EB Garamond, Garamond, Cormorant Garamond, Georgia, serif" font-style="italic" font-size="15" fill="#4A5159">Shanghai</text>
  <text x="250" y="112" text-anchor="middle" font-family="EB Garamond, Garamond, Cormorant Garamond, Georgia, serif" font-style="italic" font-size="15" fill="#4A5159">Shenzhen</text>
  <text x="380" y="112" text-anchor="middle" font-family="EB Garamond, Garamond, Cormorant Garamond, Georgia, serif" font-style="italic" font-size="15" fill="#4A5159">Delft</text>
  <text x="520" y="112" text-anchor="middle" font-family="EB Garamond, Garamond, Cormorant Garamond, Georgia, serif" font-style="italic" font-size="15" fill="#4A5159">Madrid</text>
  <text x="736" y="112" text-anchor="middle" font-family="EB Garamond, Garamond, Cormorant Garamond, Georgia, serif" font-style="italic" font-weight="500" font-size="17" fill="#0F1417">Amsterdam</text>

  <!-- "Here, now" label under Amsterdam in mono caps -->
  <text x="736" y="126" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="9" letter-spacing="0.24em" fill="#0E5347">HERE · NOW</text>
</svg>
